name: Daily USDA Data Refresh

on:
  schedule:
    # 10 AM UTC = 5 AM CT (runs every day)
    - cron: '0 10 * * *'
  workflow_dispatch:   # allow manual run from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push updated JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run USDA data update
        env:
          USDA_API_KEY: ${{ secrets.USDA_MPR_API_KEY }}
        run: python update_usda_data.py

      - name: Run forecast engine
        run: python forecast_cuts.py

      - name: Generate AI narrative
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_narrative.py

      - name: Sync netlify-deploy data
        run: |
          cp data/latest.json    netlify-deploy/data/latest.json
          cp data/forecasts.json netlify-deploy/data/forecasts.json
          cp data/narrative.json netlify-deploy/data/narrative.json

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/forecasts.json data/narrative.json \
                  netlify-deploy/data/latest.json netlify-deploy/data/forecasts.json \
                  netlify-deploy/data/narrative.json
          # only commit if something changed
          git diff --cached --quiet || git commit -m "chore: daily USDA refresh $(date -u '+%Y-%m-%d')"
          git push
