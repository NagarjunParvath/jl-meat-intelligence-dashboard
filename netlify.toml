# ─────────────────────────────────────────────────────────────────────
# Jack Link's MIC — Netlify configuration
# Publish: static HTML + pre-built JSON (no server-side build needed)
# Data refresh: handled by GitHub Actions daily cron → commits JSON
#              → triggers this Netlify deploy automatically
# ─────────────────────────────────────────────────────────────────────

[build]
  publish = "."
  command = "echo 'Static site — no build step required'"

# ── Root redirect: / → dashboard ─────────────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/remixed-8840b12b"
  status = 200

# ── Cache control: force browser to always fetch fresh JSON ──────────
[[headers]]
  for = "/data/latest.json"
  [headers.values]
    Cache-Control    = "no-cache, no-store, must-revalidate"
    Pragma           = "no-cache"
    Expires          = "0"

[[headers]]
  for = "/data/forecasts.json"
  [headers.values]
    Cache-Control    = "no-cache, no-store, must-revalidate"
    Pragma           = "no-cache"
    Expires          = "0"

[[headers]]
  for = "/data/history.json"
  [headers.values]
    Cache-Control    = "max-age=3600"

# ── Security headers ─────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
