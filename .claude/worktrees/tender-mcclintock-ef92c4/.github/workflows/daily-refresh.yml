name: Daily USDA Refresh

# ─── Triggers ───────────────────────────────────────────────
on:
  schedule:
    # 10 pm UTC = 6 pm ET, Mon–Fri  (USDA afternoon release is ~3–5 pm ET)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # "Run workflow" button in GitHub → Actions tab

# Needs write access to commit the refreshed data files back
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pipeline dependencies
        run: pip install pypdf requests scikit-learn numpy scipy

      # ── 3. USDA data download + parse ────────────────────────
      - name: Download & parse USDA reports → latest.json
        env:
          USDA_MPR_API_KEY: ${{ secrets.USDA_MPR_API_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python update_usda_data.py

      # ── 4. Retrain forecasts ──────────────────────────────────
      - name: Retrain quantile GBMs → forecasts.json
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python forecast_cuts.py

      # ── 5. Commit refreshed data back to main ────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/forecasts.json data/history.json
          # Only commit if something actually changed
          git diff --cached --quiet \
            && echo "No data changes today — skipping commit." \
            || git commit -m "chore: daily USDA refresh $(date -u +%Y-%m-%d)"
          git push
